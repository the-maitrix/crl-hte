[project]
name = "crl-hte-reproducibility"
version = "1.0.0"
description = "Reproducibility code for outcome-guided representation learning in CATE estimation."
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "torch>=2.1",
    "causalml>=0.14",
    "econml>=0.15",
    "omegaconf>=2.3",
    "tqdm>=4.66",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.1"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
